name: Build Mafore Notepad for Windows

on:
  push:
    branches: ["main"]
    paths:
      - "Mafore_Notepad/**"
      - ".github/workflows/build-mafore-notepad.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller
      - name: Build standalone Windows EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name MaforeNotepad Mafore_Notepad/mafore_notepad.py
      - name: Upload EXE as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: MaforeNotepad-Windows
          path: dist/MaforeNotepad.exe
          if-no-files-found: error
          retention-days: 30
